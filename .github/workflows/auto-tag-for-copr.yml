name: Auto Tag for Copr

on:
  push:
    branches:
      - test
    paths:
      - '**/*.spec'

jobs:
  create-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install RPM tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Detect changes and push tags
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 获取本次 push 修改过的文件列表
          CHANGED_FILES=$(git diff --name-only HEAD^ HEAD)
          
          echo "Detected changed files:"
          echo "$CHANGED_FILES"

          for file in $CHANGED_FILES; do
            # 1. 必须是 .spec 结尾
            if [[ "$file" != *.spec ]]; then
              continue
            fi

            # --- 路径判断逻辑 ---
            DIRNAME=$(dirname "$file")
            BASENAME=$(basename "$file")
            NAME_NO_EXT="${BASENAME%.spec}"
            IS_VALID=false

            # 情况 A: 路径为 "包名/包名.spec" (例如: mypkg/mypkg.spec)
            if [[ "$DIRNAME" == "$NAME_NO_EXT" ]]; then
              IS_VALID=true
            # 情况 B: 路径为 "utils/包名/包名.spec" (例如: utils/mypkg/mypkg.spec)
            elif [[ "$DIRNAME" == "utils/$NAME_NO_EXT" ]]; then
              IS_VALID=true
            fi
            
            if [ "$IS_VALID" = false ]; then
              echo "Skipping $file: does not match 'PackageName/PackageName.spec' or 'utils/PackageName/PackageName.spec' pattern."
              continue
            fi
            # ---------------------------

            echo "Processing spec file: $file"
            
            # 解析 Name, Version, Release
            PKG_NAME=$(rpmspec -q --queryformat "%{NAME}" "$file" 2>/dev/null || grep -i "^Name:" "$file" | awk '{print $2}')
            PKG_VERSION=$(rpmspec -q --queryformat "%{VERSION}" "$file" 2>/dev/null || grep -i "^Version:" "$file" | awk '{print $2}')
            PKG_RELEASE=$(rpmspec -q --queryformat "%{RELEASE}" "$file" 2>/dev/null || grep -i "^Release:" "$file" | awk '{print $2}')
            
            # 清理 Release 字段 (去掉 %{?dist} 和 .fcXX)
            PKG_RELEASE=$(echo "$PKG_RELEASE" | sed 's/%{?dist}//g' | sed 's/\.fc[0-9]*//g')

            if [ -z "$PKG_NAME" ] || [ -z "$PKG_VERSION" ]; then
              echo "Error: Could not parse Name or Version from $file"
              continue
            fi

            # 构造 Tag: PKGNAME-VERSION-RELEASE
            TAG_NAME="${PKG_NAME}-${PKG_VERSION}-${PKG_RELEASE}"

            echo "Target Tag: $TAG_NAME"

            if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
              echo "Tag $TAG_NAME already exists. Skipping."
            else
              echo "Creating tag $TAG_NAME..."
              git tag "$TAG_NAME"
              git push origin "$TAG_NAME"
              echo "Tag $TAG_NAME pushed successfully."
            fi
          done